name: Build FORGE Capture (Windows)

# Manual builds of the FORGE Capture desktop app for Windows.
# Produces the unsigned per-user NSIS installer (internal/dev-machine use
# only — see forge-capture-app/docs/packaging.md signing gate).
# Run it from the Actions tab; the installer lands as a workflow artifact.

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI v2
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build Tauri app (NSIS bundle)
        working-directory: forge-capture-app/app
        run: cargo tauri build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: forge-capture-windows-installer
          path: forge-capture-app/target/release/bundle/nsis/*.exe
          if-no-files-found: error
