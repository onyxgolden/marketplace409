# Scheduled sync of the FORGE Engineering Brain index (scripts/engineering-brain/) into Supabase
# (Phase 3's persistence layer), so the data Phase 2's query CLI and any future application code
# reads stays current without a manual run.
#
# Deliberately conservative, matching forge-governance-refresh.yml's precedent:
#   1. Runs nightly + on manual dispatch, not on every push to main -- syncing is naturally idempotent
#      (the migration's unique (commit_sha, index_content_hash) constraint makes re-syncing an
#      unchanged commit a safe no-op), so there's no correctness reason to run it more often, and
#      running it less often keeps CI minutes and Supabase write volume low.
#   2. Never commits anything back to the repository and never pushes to main -- a push to main is
#      what triggers this repo's Vercel Production deployment, and this workflow has no reason to
#      touch application code or trigger a deploy. The regenerated manifest/report exist only in the
#      CI runner's own workspace for this run; the committed engineering-brain/index-manifest.json
#      stays a point-in-time snapshot from whenever it was last regenerated by hand, not something
#      this workflow maintains.
#   3. Only requests `contents: read` -- this workflow reads the repository and writes to Supabase,
#      nothing else, so it needs no write permission on the repository itself.
#   4. A dedicated verification step (verifySync.mjs) re-reads the row counts Postgres itself reports
#      for the run just synced and compares them against the manifest's own counts, failing the job
#      loudly on any mismatch rather than letting a partial sync report false success.
#
# Requires two repository configuration values, neither committed here:
#   - secret SUPABASE_SERVICE_ROLE_KEY -- bypasses RLS to write; Production-sensitive, must stay a
#     GitHub Actions secret, never a plain workflow env var.
#   - NEXT_PUBLIC_SUPABASE_URL is hardcoded below as a literal, not a secret -- it is a NEXT_PUBLIC_
#     variable by Next.js's own convention, meaning it is already public in every client bundle this
#     app ships; treating it as sensitive would be a false sense of security, not real protection.

name: FORGE Engineering Brain Sync

on:
  schedule:
    - cron: '0 9 * * *'   # 3:00 AM America/Chicago during CDT (UTC-6, roughly Mar-Nov)
    - cron: '0 10 * * *'  # 3:00 AM America/Chicago during CST (UTC-6, roughly Nov-Mar)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: engineering-brain-sync
  cancel-in-progress: true

env:
  NEXT_PUBLIC_SUPABASE_URL: https://bzqvenxjlstinmgbuvvg.supabase.co

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build the index
        run: node scripts/engineering-brain/runEngineeringBrainIndexer.mjs

      - name: Sync the index to Supabase
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/engineering-brain/persistence/syncManifestToSupabase.mjs

      - name: Verify the sync
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/engineering-brain/persistence/verifySync.mjs
