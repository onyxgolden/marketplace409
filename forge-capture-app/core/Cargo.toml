[package]
name = "forge-capture-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Pure, platform-neutral core for FORGE Capture: coordinate conversion, artifact contract, result/stitch layer, acquisition engine traits"

[lib]
name = "forge_capture_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Only built when targeting Windows: the crate is used exclusively behind
# `#[cfg(windows)]` (see native.rs). Depending on it unconditionally breaks
# host (Linux/macOS) builds because windows-future does not compile there.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[dev-dependencies]
