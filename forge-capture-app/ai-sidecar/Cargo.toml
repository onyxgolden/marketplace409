[package]
name = "forge-capture-ai-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FORGE Capture AI sidecar (brief §2.1 runtime boundary): sandboxed, no-network, no-export-authority process. This build (C2-P2 scaffolding slice) wires the real process boundary and length-prefixed IPC only - no OCR/NER/caption model runtime is linked in; every request is answered with a typed not-implemented response until that dependency/model is separately authorized."

[[bin]]
name = "forge-capture-ai-sidecar"
path = "src/main.rs"

[dependencies]
forge-capture-core = { path = "../core" }
serde_json = "1.0"
