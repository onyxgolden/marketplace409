[package]
name = "forge-capture-ai-sidecar"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FORGE Capture AI sidecar (brief §2.1 runtime boundary): sandboxed, no-network, no-export-authority process. This build (C2-P2 OCR slice) wires the real PP-OCR ONNX Runtime inference (detection + recognition) behind the C2-P1 IPC protocol and C2-P2 scaffolding's framing; NER/caption dispatch remain OPERATION_NOT_IMPLEMENTED until their own separately authorized slices."

[[bin]]
name = "forge-capture-ai-sidecar"
path = "src/main.rs"

[dependencies]
forge-capture-core = { path = "../core" }
serde_json = "1.0"
# ONNX Runtime bindings for the PP-OCR det/rec forward pass (brief §2.2/§9).
# Pinned exact pre-1.0 release, not a caret range - this crate has no
# stable 1.0 yet, so an exact pin is the closest available approximation
# of brief §9's "pin exact source revisions" for this dependency.
ort = "=2.0.0-rc.15"
# Pure-Rust PNG/JPEG decode for sidecar-side image loading (brief §2.1's
# own image handling - no libpng/native codec). Only the codecs this
# program's own capture pipeline and common imported screenshots use.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
