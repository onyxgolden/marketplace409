<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Select region</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.25);
      cursor: crosshair;
      user-select: none;
    }
    #hint {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 26, 0.9);
      color: #e8eaed;
      font: 13px "Segoe UI", system-ui, sans-serif;
      padding: 8px 14px;
      border-radius: 6px;
      pointer-events: none;
    }
    #sel {
      position: fixed;
      border: 2px solid #d99a3d;
      background: rgba(217, 154, 61, 0.12);
      display: none;
      pointer-events: none;
    }
    #dims {
      position: fixed;
      background: rgba(20, 22, 26, 0.9);
      color: #e8eaed;
      font: 12px "Segoe UI", system-ui, sans-serif;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="hint">Drag to select a region — Esc cancels</div>
  <div id="sel"></div>
  <div id="dims"></div>
  <script src="overlay.js"></script>
</body>
</html>
