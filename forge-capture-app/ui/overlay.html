<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Select region</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      cursor: none;
      user-select: none;
    }
    /* Frozen fullscreen frame captured just before the overlay opened.
       The crosshair and magnifier aim on this image; the real capture
       happens on the live screen after the overlay closes. */
    #backdrop {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      pointer-events: none;
      display: none;
    }
    #hint {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 22, 26, 0.9);
      color: #e8eaed;
      font: 13px "Segoe UI", system-ui, sans-serif;
      padding: 8px 14px;
      border-radius: 6px;
      pointer-events: none;
      z-index: 30;
    }
    /* Blank-frame warning: the frozen frame came back a single solid
       color, which usually means the capture pipeline produced a dead
       frame — but a genuinely solid-color desktop is legitimate, so the
       user chooses: retry the capture, proceed anyway, or Esc to cancel. */
    #blankwarn {
      position: fixed;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(64, 42, 8, 0.95);
      border: 1px solid #d99a3d;
      color: #f5e6c8;
      font: 13px "Segoe UI", system-ui, sans-serif;
      padding: 10px 14px;
      border-radius: 6px;
      display: none;
      z-index: 31;
      text-align: center;
    }
    #blankwarn button {
      margin: 8px 6px 0;
      font: 13px "Segoe UI", system-ui, sans-serif;
      padding: 6px 14px;
      border-radius: 4px;
      border: 1px solid #d99a3d;
      background: #2a2d33;
      color: #e8eaed;
      cursor: pointer;
    }
    #blankwarn button:hover { background: #3a3e46; }
    #blankwarn #bw-proceed { background: #4a3a12; }
    .crosshair {
      position: fixed;
      background: rgba(217, 154, 61, 0.85);
      pointer-events: none;
      display: none;
      z-index: 10;
    }
    #ch-v { top: 0; bottom: 0; width: 1px; }
    #ch-h { left: 0; right: 0; height: 1px; }
    #loupe {
      position: fixed;
      width: 148px;
      height: 148px;
      border: 2px solid #d99a3d;
      border-radius: 50%;
      background: #111;
      pointer-events: none;
      display: none;
      z-index: 20;
    }
    #coords {
      position: fixed;
      background: rgba(20, 22, 26, 0.92);
      color: #e8eaed;
      font: 12px "Segoe UI", system-ui, sans-serif;
      padding: 4px 8px;
      border-radius: 4px;
      pointer-events: none;
      display: none;
      z-index: 20;
      white-space: nowrap;
    }
    #sel {
      position: fixed;
      border: 2px solid #d99a3d;
      background: rgba(217, 154, 61, 0.12);
      display: none;
      pointer-events: none;
      z-index: 15;
    }
    #dims {
      position: fixed;
      background: rgba(20, 22, 26, 0.92);
      color: #e8eaed;
      font: 12px "Segoe UI", system-ui, sans-serif;
      padding: 4px 8px;
      border-radius: 4px;
      display: none;
      pointer-events: none;
      z-index: 20;
    }
  </style>
</head>
<body>
  <img id="backdrop" alt="" />
  <div id="hint">Drag to select a region — Esc cancels</div>
  <div id="blankwarn">
    <div>The captured screen looks blank — the capture may have failed.</div>
    <button id="bw-retry" type="button">Retry capture</button>
    <button id="bw-proceed" type="button">Proceed anyway</button>
  </div>
  <div id="ch-v" class="crosshair"></div>
  <div id="ch-h" class="crosshair"></div>
  <canvas id="loupe" width="148" height="148"></canvas>
  <div id="coords"></div>
  <div id="sel"></div>
  <div id="dims"></div>
  <script type="module" src="overlay.js"></script>
</body>
</html>
