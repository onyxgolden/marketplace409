[package]
name = "forge-capture-app"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "FORGE Capture Rung 2a — standalone Windows-first Tauri capture shell"
default-run = "forge-capture-app"

[[bin]]
name = "forge-capture-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forge-capture-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]
